info:
  name: Get API Key
  type: http
  seq: 2

http:
  method: GET
  url: "{{DELINEA_URL}}/api/v2/secrets/{{DELINEA_SECRET_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{delineaToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
